name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run typecheck:e2e
      - run: bun run test
      - run: bun run build
      - name: node smoke
        run: |
          node -e '
            const major = Number(process.versions.node.split(".")[0]);
            if (major < 24) {
              throw new Error("need Node 24+, got " + process.version);
            }
            import("./dist/index.js").then((m) => {
              if (typeof m.createGmailTools !== "function") {
                throw new Error("missing export: createGmailTools");
              }
              console.log("node smoke ok", process.version);
            });
          '
